name: Deploy to PWS

on:
    push:
        branches:
            - master

permissions:
    contents: write

jobs:
    tag-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo (full history + tags)
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                fetch-tags: true

            - name: Set up git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Tentukan versi baru
              id: bump
              run: |
                  set -e

                  LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

                  if [ -z "$LAST_TAG" ]; then
                      LAST_VERSION="0.0.0"
                      RANGE="HEAD"
                  else
                      LAST_VERSION="${LAST_TAG#v}"
                      RANGE="$LAST_TAG..HEAD"
                  fi

                  COMMITS=$(git log $RANGE --pretty=format:"%s%n%b")

                  if [ -z "$COMMITS" ]; then
                      echo "Gak ada commit baru sejak tag terakhir, skip tagging."
                      echo "should_tag=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  BUMP="patch"

                  if echo "$COMMITS" | grep -qiE "^feat(\([a-z0-9 _-]+\))?:"; then
                      BUMP="minor"
                  fi

                  if echo "$COMMITS" | grep -qiE "^[a-z]+(\([a-z0-9 _-]+\))?!:" || echo "$COMMITS" | grep -q "BREAKING CHANGE"; then
                      BUMP="major"
                  fi

                  IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"

                  case "$BUMP" in
                      major)
                          MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
                          ;;
                      minor)
                          MINOR=$((MINOR + 1)); PATCH=0
                          ;;
                      patch)
                          PATCH=$((PATCH + 1))
                          ;;
                  esac

                  NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

                  echo "Bump type: $BUMP"
                  echo "Versi lama: $LAST_VERSION -> Versi baru: $NEW_VERSION"

                  echo "should_tag=true" >> "$GITHUB_OUTPUT"
                  echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

            - name: Buat dan push tag baru
              if: steps.bump.outputs.should_tag == 'true'
              run: |
                  NEW_VERSION="${{ steps.bump.outputs.new_version }}"
                  git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
                  git push origin "$NEW_VERSION"

            - name: Push ke PWS
              env:
                  PWS_USERNAME: ${{ secrets.PWS_USERNAME }}
                  PWS_PASSWORD: ${{ secrets.PWS_PASSWORD }}
                  PWS_REMOTE_URL: ${{ secrets.PWS_REMOTE_URL }}
              run: |
                  HOST_AND_PATH=$(echo "$PWS_REMOTE_URL" | sed -E 's#^https?://##')
                  AUTH_URL="https://${PWS_USERNAME}:${PWS_PASSWORD}@${HOST_AND_PATH}"

                  git remote add pws "$AUTH_URL" 2>/dev/null || git remote set-url pws "$AUTH_URL"

                  git push pws HEAD:master